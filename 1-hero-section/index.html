<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="container">
        <nav class="navbar">
          <div class="logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/d/d5/Tailwind_CSS_Logo.svg" alt="no img " />
          </div>
          <ul class="nav-menu">
            <li><a href="#product">Product</a></li>
            <li><a href="#features">Features</a></li>
            <li><a href="#marketplace">Marketplace</a></li>
            <li><a href="#company">Company</a></li>
          </ul>
          <div class="nav-login">
            <a href="#login">Log in <span class="arrow">→</span></a>
          </div>
        </nav>
      </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
      <div class="container">
        <div class="hero-content">
          <div class="announcement">
            <span>Announcing our next round of funding.</span>
            <a href="#" class="read-more"
              >Read more <span class="arrow">→</span></a
            >
          </div>

          <h1 class="hero-title">Data to enrich your online business</h1>

          <p class="hero-description">
            Anim aute id magna aliqua ad ad non deserunt sunt. Qui irure qui
            lorem cupidatat commodo. Elit sunt amet fugiat veniam occaecat
            fugiat aliqua.
          </p>

          <div class="hero-buttons">
            <button class="btn btn-primary">Get started</button>
            <button class="btn btn-secondary">
              Learn more <span class="arrow">→</span>
            </button>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
